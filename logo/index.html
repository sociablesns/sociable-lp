<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sociable ロゴ — モノライン再現</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--blue:#1a56d6;--gray:#5f7196;--line:#e4ecf7}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Noto Sans JP",sans-serif;background:#fff;color:#0d203f;padding:30px 20px}
  h1{font-size:18px;text-align:center;margin-bottom:4px}
  .note{text-align:center;color:var(--gray);font-size:12.5px;margin-bottom:24px}
  .stage{max-width:560px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;text-align:center;box-shadow:0 10px 30px rgba(10,31,68,.05)}
  .mark{display:block;margin:0 auto}
  .wordmark{display:flex;align-items:baseline;justify-content:center;gap:14px;margin-top:6px}
  .kk{font-family:"Noto Sans JP";font-weight:700;font-size:26px;color:var(--blue);letter-spacing:.12em}
  .sc{font-family:"Quicksand";font-weight:600;font-size:64px;color:var(--blue);letter-spacing:.01em;line-height:1}
  .row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:24px}
  .chip{width:84px;height:84px;border-radius:20px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
  .chip.blue{background:var(--blue);border:none}
  .clab{font-size:11px;color:var(--gray);margin-top:6px}
  .col{display:flex;flex-direction:column;align-items:center}
</style></head>
<body>
<h1>Sociable ロゴ（モノライン再現・SVGベクター）</h1>
<div class="note">GPT画像の路線をベクターで再現。線の太さ・S字・人の形・書体は見ながら微調整できます。</div>

<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7bff"/><stop offset="1" stop-color="#1a56d6"/></linearGradient>
</defs></svg>

<div class="stage">
  <!-- メインロゴ -->
  <svg class="mark" width="380" height="230" viewBox="0 0 260 165" fill="none" stroke="#1a56d6" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- wheels -->
    <circle cx="52" cy="120" r="31"/>
    <circle cx="208" cy="120" r="31"/>
    <!-- hubs -->
    <circle cx="52" cy="120" r="2.4" fill="#1a56d6" stroke="none"/>
    <circle cx="208" cy="120" r="2.4" fill="#1a56d6" stroke="none"/>
    <!-- frame: L-hub→seat1→crank→seat2→stem→front fork ; bottom bar -->
    <path d="M52 120 L96 70"/>
    <path d="M96 70 L130 120"/>
    <path d="M130 120 L150 70"/>
    <path d="M150 70 L190 62"/>
    <path d="M190 62 L208 120"/>
    <path d="M52 120 L130 120"/>
    <!-- crank/pedal -->
    <circle cx="130" cy="120" r="2.6" fill="#1a56d6" stroke="none"/>
    <path d="M130 120 L138 132"/>
    <!-- handlebar -->
    <path d="M182 60 L198 58"/>
    <!-- S-wave top tube (sociableのS) -->
    <path d="M96 70 C112 52 134 88 150 70"/>
    <!-- rider 1 -->
    <circle cx="92" cy="36" r="10.5" fill="#1a56d6" stroke="none"/>
    <path d="M92 43 C82 52 80 64 96 70"/>
    <!-- rider 2 -->
    <circle cx="150" cy="36" r="10.5" fill="#1a56d6" stroke="none"/>
    <path d="M150 43 C148 52 146 64 150 70"/>
  </svg>
  <!-- wordmark -->
  <div class="wordmark"><span class="sc">sociable</span></div>

  <div class="row">
    <div class="col"><div class="chip blue">
      <svg width="60" height="42" viewBox="0 0 260 165" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="52" cy="120" r="31"/><circle cx="208" cy="120" r="31"/>
        <path d="M52 120 L96 70"/><path d="M96 70 L130 120"/><path d="M130 120 L150 70"/><path d="M150 70 L190 62"/><path d="M190 62 L208 120"/><path d="M52 120 L130 120"/>
        <path d="M182 60 L198 58"/><path d="M96 70 C112 52 134 88 150 70"/>
        <circle cx="92" cy="36" r="10.5" fill="#fff" stroke="none"/><path d="M92 43 C82 52 80 64 96 70"/>
        <circle cx="150" cy="36" r="10.5" fill="#fff" stroke="none"/><path d="M150 43 C148 52 146 64 150 70"/>
      </svg></div><div class="clab">IGアイコン</div></div>
    <div class="col"><div class="chip">
      <svg width="60" height="42" viewBox="0 0 260 165" fill="none" stroke="#1a56d6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="52" cy="120" r="31"/><circle cx="208" cy="120" r="31"/>
        <path d="M52 120 L96 70"/><path d="M96 70 L130 120"/><path d="M130 120 L150 70"/><path d="M150 70 L190 62"/><path d="M190 62 L208 120"/><path d="M52 120 L130 120"/>
        <path d="M182 60 L198 58"/><path d="M96 70 C112 52 134 88 150 70"/>
        <circle cx="92" cy="36" r="10.5" fill="#1a56d6" stroke="none"/><path d="M92 43 C82 52 80 64 96 70"/>
        <circle cx="150" cy="36" r="10.5" fill="#1a56d6" stroke="none"/><path d="M150 43 C148 52 146 64 150 70"/>
      </svg></div><div class="clab">白地</div></div>
  </div>
</div>
</body></html>
